name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Generate Debug Keystore (to fix debugConfig evaluation)
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Generate Release Keystore for SantianDev
      run: keytool -genkey -v -keystore release.keystore -storepass android123 -alias upload -keypass android123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SantianDev,O=SantianDev,C=RU"

    - name: Build Release APK
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        STORE_PASSWORD: android123
        KEY_PASSWORD: android123
      run: ./gradlew assembleRelease --build-cache --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-v1.1-SantianDev
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      with:
        tag_name: build-${{ github.run_number }}
        name: Calculator Build ${{ github.run_number }}
        files: app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
